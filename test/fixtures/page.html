<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bridge test page</title>
  </head>
  <body>
    <h1>Bridge test page</h1>
    <p id="app">app: none</p>
    <script>
      // Behaves like Haven: tools are registered with an AbortSignal and the
      // whole set is replaced when the focused app changes.
      const mc = document.modelContext || navigator.modelContext;
      let controller = null;
      window.calls = [];

      function register(app) {
        controller?.abort();
        controller = new AbortController();
        const tools = [
          {
            name: "demo_echo",
            description: "Echoes the input and says which origin answered.",
            inputSchema: { type: "object", properties: { text: { type: "string" } }, required: ["text"] },
            annotations: { readOnlyHint: true },
            execute: async (input) => {
              window.calls.push(input);
              return { origin: location.origin, app, text: input.text };
            },
          },
          {
            name: "demo_slow",
            description: "Counts a write after a delay (for connection-loss tests).",
            inputSchema: { type: "object", properties: { ms: { type: "number" } } },
            execute: async (input) => {
              await new Promise((r) => setTimeout(r, input.ms || 1500));
              window.writes = (window.writes || 0) + 1;
              return { writes: window.writes };
            },
          },
          {
            name: "demo_image",
            description: "Returns an image as MCP content, like a rendered sketch.",
            inputSchema: { type: "object", properties: {} },
            annotations: { readOnlyHint: true },
            execute: async () => ({
              content: [
                { type: "text", text: "1x1 red pixel" },
                {
                  type: "image",
                  mimeType: "image/png",
                  data: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFBQIAX8jx0gAAAABJRU5ErkJggg==",
                },
              ],
            }),
          },
          {
            name: "demo_locked",
            description: "Fails like Haven does when it is locked.",
            inputSchema: { type: "object", properties: {} },
            execute: async () => {
              throw new Error(JSON.stringify({ error: "LOCKED", message: "Haven is locked.", contextVersion: 1 }));
            },
          },
        ];
        if (app) {
          tools.push({
            name: `${app}_list`,
            description: `Lists items of ${app}.`,
            inputSchema: { type: "object", properties: {} },
            annotations: { readOnlyHint: true, untrustedContentHint: true },
            execute: async () => `items of ${app}`,
          });
        }
        for (const tool of tools) mc.registerTool(tool, { signal: controller.signal });
        document.getElementById("app").textContent = `app: ${app || "none"}`;
      }

      window.focusApp = register;
      register(null);
    </script>
  </body>
</html>
